services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: portfolio-os-backend
    ports:
      - '3200:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      MASTER_SECRET: ${MASTER_SECRET}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-true}
      TRACK_QUERIES: ${TRACK_QUERIES:-true}
      MEDIUM_USERNAME: ${MEDIUM_USERNAME:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "curl", "-sS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingest-jobs:
    image: curlimages/curl
    container_name: portfolio-os-ingest
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio-net
    command: >
      sh -c "
      echo 'Starting ingestion jobs...' &&
      curl -sS -X POST http://backend:3000/api/admin/ingest/resume &&
      curl -sS -X POST http://backend:3000/api/admin/ingest/cheatsheet &&
      curl -sS -X POST http://backend:3000/api/admin/ingest/github &&
      curl -sS -X POST http://backend:3000/api/admin/ingest/medium -H 'Content-Type: application/json' -d '{\"username\":\"${MEDIUM_USERNAME:-}\"}' &&
      echo 'Ingestion jobs completed.'
      "


  qdrant:
    image: qdrant/qdrant:latest
    container_name: portfolio-os-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - portfolio-net

volumes:
  qdrant-data:

networks:
  portfolio-net:
    driver: bridge
